<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>BBS Coding Club — Build. Learn. Compete. Connect.</title>
    <meta name="title" content="BBS Coding Club — Build. Learn. Compete. Connect." />
    <meta name="description" content="The official digital identity and engineering collective of BBS Coding Club. We build systems, compete in hackathons, conduct peer workshops, and ship open source." />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bbscodingclub.org/" />
    <meta property="og:title" content="BBS Coding Club — Build. Learn. Compete. Connect." />
    <meta property="og:description" content="Student engineering community turning technical curiosity into real software and competitive breakthroughs." />
    <meta property="og:image" content="/og-preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="BBS Coding Club — Build. Learn. Compete. Connect." />
    <meta property="twitter:description" content="Student engineering community turning technical curiosity into real software and competitive breakthroughs." />
    <meta property="twitter:image" content="/og-preview.png" />

    <!-- Fonts: Space Grotesk (Editorial Display) & JetBrains Mono (Technical Monospace) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Theme Initialization: Prevents Flash of Wrong Theme (FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bbs-coding-club-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light' || (!saved && !prefersDark)) {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
